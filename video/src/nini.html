<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:600;src:url(fonts/package/files/fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(fonts/package/files/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Baloo2;font-weight:600;src:url(fonts/baloo/package/files/baloo-2-devanagari-600-normal.woff2)}
@font-face{font-family:Baloo2;font-weight:700;src:url(fonts/baloo/package/files/baloo-2-devanagari-700-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>

<script>
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
const BEAT=0.4285,PH=0.115;
const MAROON='#752C39',GOLD='#D9BC79',GOLD2='#8E6A2E',CREAM='#F7F2E9';
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const backOut=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function rnd(s){let x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const beatPhase=t=>(((t-PH)/BEAT)%1+1)%1;
const bounce=t=>{const p=beatPhase(t);return Math.pow(Math.sin(Math.PI*p),1.6)}; // 0..1 per beat
function ell(x,y,rx,ry,fill,rot=0){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}}
function rr(x,y,w,h,r,fill){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill()}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;
  const f=v=>Math.round(clamp(k<0?v*(1+k):v+(255-v)*k,0,255));return`rgb(${f(r)},${f(gg)},${f(b)})`}

// ---------- characters ----------
const ELE=[
 {c:'#6F93DE',bl:MAROON,name:'मोती'},
 {c:'#3DB6A8',bl:'#2B4C8C',name:'चीकू'},
 {c:'#F2A04E',bl:'#7A2E6E',name:'गप्पू'},
 {c:'#9A72D6',bl:'#1F6B52',name:'बबली'},
 {c:'#F27FAE',bl:'#C2410C',name:'पिंकी'},
];
// elephant facing right at (x,y)=feet centre. opts: s scale, dir, walk (phase), trunk (0 down..1 up), blink, squash, mood
function elephant(i,x,y,o={}){
  const E=ELE[i],s=o.s||1,dir=o.dir||1,c=E.c,dk=shade(c,-.22),lt=shade(c,.25);
  const wk=o.walk??null, sq=o.squash||0, tr=o.trunk??0.2, tt=o.t||0;
  g.save();g.translate(x,y);g.scale(s*dir,s);if(o.rot)g.rotate(o.rot);
  g.scale(1+sq*.12,1-sq*.12);
  // shadow
  if(!o.noShadow){g.save();g.globalAlpha=.18;ell(0,4,120,16,'#000');g.restore()}
  const lg=(lx,ph,front)=>{const sw=wk===null?0:Math.sin(wk*Math.PI*2+ph)*14;const lift=wk===null?0:Math.max(0,Math.sin(wk*Math.PI*2+ph))*10;
    g.save();g.translate(lx+sw,-lift);rr(-22,-95,44,95,18,front?c:dk);
    for(let k=0;k<3;k++)ell(-12+k*12,-6,6,5,CREAM);g.restore()};
  lg(-62,Math.PI,false);lg(48,0,false);
  // tail
  g.strokeStyle=dk;g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(-118,-120);
  const tw=Math.sin(tt*6)*12;g.quadraticCurveTo(-150,-110+tw,-150,-70+tw);g.stroke();ell(-150,-64+tw,9,13,dk);
  // body
  ell(0,-130,128,82,c);
  ell(-10,-100,100,40,shade(c,-.08));
  // blanket (jhool)
  g.save();g.beginPath();g.moveTo(-78,-200);g.quadraticCurveTo(-5,-222,62,-200);g.lineTo(70,-112);g.quadraticCurveTo(-5,-96,-86,-112);g.closePath();
  g.fillStyle=E.bl;g.fill();g.lineWidth=9;g.strokeStyle=GOLD;g.stroke();
  g.clip();for(let k=0;k<5;k++){const bx=-60+k*30;ell(bx,-158,9,9,GOLD);ell(bx,-158,4,4,E.bl)}
  g.restore();
  for(let k=0;k<8;k++){const bx=-80+k*21;ell(bx,-104+Math.abs(bx)*0.05,6,9,GOLD)}
  // head
  ell(98,-178,78,72,c);
  // ear
  const ef=Math.sin(tt*5+i)*0.08+(o.earFlap||0);
  g.save();g.translate(62,-186);g.rotate(-.15+ef);ell(-10,8,52,64,dk);ell(-8,10,38,50,'#F6B3C8');g.restore();
  // forehead ornament
  g.save();g.translate(118,-238);g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(16,6,0,22);g.quadraticCurveTo(-16,6,0,-14);g.fillStyle=GOLD;g.fill();ell(0,6,5,5,'#C0392B');g.restore();
  g.strokeStyle=GOLD;g.lineWidth=5;g.beginPath();g.arc(110,-210,40,Math.PI*1.05,Math.PI*1.75);g.stroke();
  // eye
  const bl=o.blink?.15:1;
  if(o.sleep){g.strokeStyle='#2A1A1A';g.lineWidth=6;g.beginPath();g.arc(128,-196,13,Math.PI*.15,Math.PI*.85);g.stroke()}
  else if(o.happy){g.strokeStyle='#2A1A1A';g.lineWidth=6;g.beginPath();g.arc(128,-188,13,Math.PI*1.1,Math.PI*1.9);g.stroke()}
  else{ell(128,-190,16,20*bl,'#fff');ell(132,-188,10,13*bl,'#2A1A1A');if(bl>.5){ell(136,-194,4,4,'#fff')}}
  ell(140,-160,14,8,'rgba(240,90,120,.45)');
  // trunk
  const tu=tr; g.strokeStyle=c;g.lineCap='round';g.lineWidth=34;g.beginPath();g.moveTo(160,-170);
  const ex=200+tu*30,ey=lerp(-60,-280,tu);
  g.bezierCurveTo(196,-150,lerp(205,235,tu),lerp(-110,-190,tu),ex,ey);g.stroke();
  g.lineWidth=26;g.strokeStyle=lt;g.globalAlpha=.25;g.stroke();g.globalAlpha=1;
  g.lineWidth=6;g.strokeStyle=dk;for(let k=1;k<4;k++){const p=k/4;}
  ell(ex,ey,17,10,dk,tu>.5?0.3:-.3);
  // tusk
  g.fillStyle=CREAM;g.beginPath();g.moveTo(150,-140);g.quadraticCurveTo(175,-118,190,-128);g.quadraticCurveTo(170,-132,160,-150);g.fill();
  // smile
  g.strokeStyle='#2A1A1A';g.lineWidth=5;g.beginPath();g.arc(140,-140,12,0.2,Math.PI*.8);g.stroke();
  // front legs on top
  lg(-40,0,true);lg(72,Math.PI,true);
  g.restore();
}
function spider(x,y,s,t,worry=0){
  g.save();g.translate(x,y);g.scale(s,s);
  g.strokeStyle='#3B2A5A';g.lineWidth=7;g.lineCap='round';
  for(let k=0;k<4;k++)for(const d of[-1,1]){const a=Math.sin(t*8+k)*.15;g.beginPath();g.moveTo(0,0);
    g.quadraticCurveTo(d*(40+k*4),-20+k*14+a*30,d*(56+k*3),10+k*16);g.stroke()}
  ell(0,0,38,34,'#5B3F8C');ell(-10,-12,12,8,'rgba(255,255,255,.2)');
  ell(-12,-4,11,13,'#fff');ell(12,-4,11,13,'#fff');ell(-10,-1,6,7,'#111');ell(14,-1,6,7,'#111');
  g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();
  if(worry>.5){g.arc(0,22,8,Math.PI*1.1,Math.PI*1.9)}else g.arc(0,12,9,0.2,Math.PI-.2);g.stroke();
  if(worry>0){g.globalAlpha=worry;g.fillStyle='#7FD3F5';g.beginPath();g.moveTo(34,-30);g.quadraticCurveTo(44,-14,34,-8);g.quadraticCurveTo(24,-14,34,-30);g.fill();g.globalAlpha=1}
  g.restore();
}


// Popcorn Productions logo, centred at (x,y), approx 600px box * s
function popcornLogo(x,y,s,tilt=0){g.save();g.translate(x,y);g.scale(s,s);g.translate(-300,-300);
  // board body
  g.save();g.translate(300,370);g.rotate(0.05);g.fillStyle='#1E1E1E';g.beginPath();g.moveTo(-235,-180);g.lineTo(225,-185);g.lineTo(240,215);g.lineTo(-215,225);g.closePath();g.fill();
  // lower stripes
  g.fillStyle='#C9D3DD';[[-180],[-90],[0],[90],[170]].forEach(([sx],k)=>{g.beginPath();g.moveTo(sx,-170);g.lineTo(sx+55,-170);g.lineTo(sx+40,-115);g.lineTo(sx-15,-115);g.closePath();g.fill()});g.restore();
  // top arm (clapper) – opens with tilt
  g.save();g.translate(80,185);g.rotate(-0.38-tilt);g.fillStyle='#1E1E1E';g.beginPath();g.roundRect(-10,-60,420,70,10);g.fill();
  g.fillStyle='#C9D3DD';for(let k=0;k<5;k++){const sx=20+k*80;g.beginPath();g.moveTo(sx,-55);g.lineTo(sx+45,-55);g.lineTo(sx+25,5);g.lineTo(sx-20,5);g.closePath();g.fill()}
  ell(15,-5,9,9,'#888');g.restore();
  // popcorn
  g.save();g.translate(330,330);g.fillStyle='#FFE600';[[0,0,62],[-50,-20,40],[45,-35,42],[-35,40,40],[35,45,42],[0,-55,38],[60,15,36],[-60,20,34]].forEach(([a,b,r])=>{g.beginPath();g.arc(a,b,r,0,7);g.fill()});
  g.fillStyle='#F7941D';g.beginPath();g.moveTo(-14,-24);g.lineTo(24,0);g.lineTo(-14,24);g.closePath();g.fill();g.restore();
  // wordmark
  g.save();g.translate(320,470);g.rotate(-0.03);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='700 88px "DejaVu Serif"';g.fillText('POPCORN',0,0);g.font='700 36px "DejaVu Sans"';
  const w='PRODUCTIONS'.split('');w.forEach((ch,k)=>g.fillText(ch,(k-5)*30,62));g.restore();
  g.restore()}

// ---------- scenery ----------
function sky(top,bot){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function mandalaSun(x,y,r,t,col='#FFC94A'){g.save();g.translate(x,y);g.rotate(t*.15);
  for(let k=0;k<16;k++){g.rotate(Math.PI/8);g.beginPath();g.moveTo(r*.9,-14);g.quadraticCurveTo(r*1.5,0,r*.9,14);g.fillStyle=k%2?'#FFB13B':'#FFDA6A';g.fill()}
  ell(0,0,r,r,col);ell(0,0,r*.72,r*.72,'#FFE08A');
  for(let k=0;k<12;k++){g.rotate(Math.PI/6);ell(r*.5,0,9,9,'#F59E0B')}
  g.restore()}
function cloud(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(255,255,255,.92)';
  [[0,0,70],[60,-20,60],[120,0,55],[60,20,60]].forEach(([a,b,r])=>{g.beginPath();g.arc(a,b,r,0,7);g.fill()});g.restore()}
function hills(t,c1='#8CCB5E',c2='#6DB04A',c3='#4F9A3C'){
  [[c1,1150,90,.004],[c2,1260,70,.006],[c3,1380,50,.009]].forEach(([c,y,a,f],k)=>{g.fillStyle=c;g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W;x+=20)g.lineTo(x,y+Math.sin(x*f+k*2)*a);g.lineTo(W,H);g.fill()})}
function ground(y,col='#7BC16A'){g.fillStyle=col;g.fillRect(0,y,W,H-y);
  g.fillStyle='rgba(255,255,255,.12)';for(let k=0;k<40;k++){ell(rnd(k)*W,y+30+rnd(k+9)*(H-y),30+rnd(k+3)*40,6,null);g.fill()}}
function folkTree(x,y,s,t,seed=1){g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#7A4A2A';g.beginPath();g.moveTo(-30,0);g.quadraticCurveTo(-18,-200,-10,-380);g.lineTo(10,-380);g.quadraticCurveTo(18,-200,30,0);g.fill();
  g.strokeStyle='#5E3720';g.lineWidth=4;for(let k=0;k<6;k++){g.beginPath();g.moveTo(-14,-40-k*55);g.quadraticCurveTo(0,-55-k*55,14,-40-k*55);g.stroke()}
  const sw=Math.sin(t*1.3+seed)*4;
  [[0,-470,170],[-120,-400,110],[120,-400,110],[-70,-560,100],[80,-560,100]].forEach(([a,b,r],k)=>{ell(a+sw,b,r,r*.9,k%2?'#3E8E41':'#4CA54F')});
  for(let k=0;k<26;k++){const a=rnd(seed*50+k)*Math.PI*2,d=rnd(seed*50+k+.5)*170;
    const lx=Math.cos(a)*d+sw,ly=-470+Math.sin(a)*d*.8;
    g.save();g.translate(lx,ly);g.rotate(a);g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(10,0,0,14);g.quadraticCurveTo(-10,0,0,-14);g.fillStyle=k%3?'#9BD770':'#FFC94A';g.fill();g.restore()}
  // mangoes
  for(let k=0;k<5;k++)ell(-90+k*45+sw,-380+rnd(k+seed)*40,12,16,'#F59E0B');
  g.restore()}
function marigold(x,y,s,col='#F59E0B'){g.save();g.translate(x,y);g.scale(s,s);
  for(let k=0;k<10;k++){g.rotate(Math.PI/5);ell(14,0,14,9,col)}ell(0,0,10,10,'#B45309');g.restore()}
function flowerBed(y,seed=0){for(let k=0;k<22;k++){const x=rnd(k+seed)*W,yy=y+rnd(k+seed+40)*60;
  g.strokeStyle='#2F7A35';g.lineWidth=5;g.beginPath();g.moveTo(x,yy+40);g.lineTo(x,yy);g.stroke();
  marigold(x,yy,.9+rnd(k)*.6,['#F59E0B','#EF4444','#F472B6','#FBBF24'][k%4])}}
// web as hammock between two trees; returns function y(x)
function webAt(x0,x1,yTop,yBase,sag){return x=>{const u=(x-x0)/(x1-x0);return yBase+sag*Math.sin(Math.PI*clamp(u))}}
function drawWeb(x0,x1,yTop,yBase,sag,t,snap=0){
  const yf=webAt(x0,x1,yTop,yBase,sag);const cx=(x0+x1)/2,cy=yTop+(yBase-yTop)*.45;
  g.save();g.strokeStyle='rgba(255,255,255,.95)';g.lineCap='round';
  g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=6;
  const N=13;const pts=[];
  for(let k=0;k<=N;k++){const u=k/N;let px,py;
    if(k===0){px=x0;py=yTop}else if(k===N){px=x1;py=yTop}else{px=lerp(x0,x1,u);py=yf(px)}
    pts.push([px,py])}
  const anchors=[[x0,yTop],[x0+40,yTop-260],[cx,yTop-330],[x1-40,yTop-260],[x1,yTop],...pts.slice(1,-1)];
  // spokes
  g.lineWidth=5;
  anchors.forEach(([ax,ay],k)=>{if(snap&&rnd(k)<snap)return;g.beginPath();g.moveTo(cx,cy);g.lineTo(ax,ay);g.stroke()});
  // rings
  g.lineWidth=3.5;
  const sorted=anchors.map(([ax,ay])=>[Math.atan2(ay-cy,ax-cx),ax,ay]).sort((a,b)=>a[0]-b[0]);
  for(let r=1;r<=6;r++){const f=r/6.5;if(snap&&rnd(r+20)<snap)continue;g.beginPath();
    sorted.forEach(([a,ax,ay],k)=>{const px=lerp(cx,ax,f),py=lerp(cy,ay,f);k?g.lineTo(px,py):g.moveTo(px,py)});g.closePath();g.stroke()}
  // main strand
  if(!snap){g.lineWidth=9;g.beginPath();g.moveTo(x0,yTop);for(let x=x0;x<=x1;x+=10)g.lineTo(x,yf(x));g.lineTo(x1,yTop);g.stroke()}
  // dew sparkles
  g.shadowBlur=0;for(let k=0;k<8;k++){const a=sorted[k*2%sorted.length];const f=.3+rnd(k)*.6;const tw=.5+.5*Math.sin(t*4+k);
    g.globalAlpha=tw;ell(lerp(cx,a[1],f),lerp(cy,a[2],f),5,5,'#E0F7FF')}
  g.restore();return yf}

function notes(x,y,t,t0,n=5){for(let k=0;k<n;k++){const p=((t-t0)*0.6+k/n)%1;if(t<t0)return;
  const nx=x+Math.sin(p*6+k)*40+k*18,ny=y-p*300;g.save();g.globalAlpha=1-p;g.translate(nx,ny);g.fillStyle=['#E11D48','#7C3AED','#0EA5E9','#F59E0B'][k%4];
  ell(0,0,14,11,g.fillStyle,-.3);g.fillRect(10,-50,6,50);g.fillRect(10,-50,24,8);g.restore()}}
function confetti(t,t0,dens=80){if(t<t0)return;for(let k=0;k<dens;k++){const sp=200+rnd(k)*300;const y=((t-t0)*sp+rnd(k+1)*H*1.2)%(H+100)-100;
  const x=rnd(k+2)*W+Math.sin(t*2+k)*30;g.save();g.translate(x,y);g.rotate(t*3+k);g.fillStyle=['#F59E0B','#EF4444','#22C55E','#3B82F6','#A855F7','#EC4899',GOLD][k%7];g.fillRect(-8,-4,16,8);g.restore()}}

// ---------- UI overlays ----------
function txt(s,x,y,size,fill,stroke,align='center',wt=700){g.font=`${wt} ${size}px Fredoka, Baloo2`;g.textAlign=align;g.textBaseline='middle';g.lineJoin='round';
  if(stroke){g.lineWidth=size*.18;g.strokeStyle=stroke;g.strokeText(s,x,y)}g.fillStyle=fill;g.fillText(s,x,y)}
// ================= "Ninni Aa Gayi" lullaby scenes (Popcorn Productions) =================
const NB=0.6475,NPH=0.4; // 92.7 BPM
const rock=t=>Math.sin(2*Math.PI*(t-NPH)/(2*NB));       // gentle sway every 2 beats
const pulse=t=>Math.pow(Math.sin(Math.PI*((((t-NPH)/NB)%1+1)%1)),2);
ELE.push({c:'#B79BE0',bl:'#9D2B5E',name:'Mumma'},{c:'#7F9CC4',bl:'#1F4E79',name:'Papa'});
const END=151.5;

// ---------- night elements ----------
function village(t){g.fillStyle='#17123D';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=30)g.lineTo(x,1540+Math.sin(x*.006)*50);g.lineTo(W,H);g.fill();
  for(let k=0;k<6;k++){const hx=60+k*180,hy=1530+Math.sin(hx*.006)*50;g.fillStyle='#221A55';g.fillRect(hx,hy-90,120,110);g.beginPath();g.moveTo(hx-15,hy-90);g.lineTo(hx+60,hy-150);g.lineTo(hx+135,hy-90);g.fill();
    const lit=.5+.5*Math.sin(t*.7+k*2);g.fillStyle=`rgba(253,224,71,${.35+.5*lit})`;g.fillRect(hx+20,hy-65,28,28);g.fillRect(hx+72,hy-65,28,28)}}
function nightSky(t,top='#0B1446',bot='#3E2A78',vil=true){sky(top,bot);
  for(let k=0;k<110;k++){const x=rnd(k)*W,y=rnd(k+50)*H*.75,tw=.35+.65*Math.abs(Math.sin(t*(.8+rnd(k+9))+k));
    g.globalAlpha=tw;ell(x,y,1.5+rnd(k+3)*2.5,1.5+rnd(k+3)*2.5,'#FFF6D5')}g.globalAlpha=1;
  const sp=(t%9)/9;if(sp<.12){const q=sp/.12;g.save();g.globalAlpha=1-q;g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();const x0=900-q*700,y0=200+q*300;g.moveTo(x0,y0);g.lineTo(x0+120,y0-50);g.stroke();g.restore()}if(vil)village(t)}
function glow(x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
function sleepyEye(x,y,r,open=0){g.strokeStyle='#3A2A2A';g.lineWidth=r*.35;g.lineCap='round';
  if(open>.5){ell(x,y,r,r*1.1,'#fff');ell(x+r*.2,y+r*.1,r*.55,r*.65,'#2A1A1A');ell(x+r*.35,y-r*.2,r*.18,r*.18,'#fff')}
  else{g.beginPath();g.arc(x,y-r*.3,r,Math.PI*.15,Math.PI*.85);g.stroke()}}
function moonFace(x,y,r,t,wink=0,open=0){glow(x,y,r*2.2,'rgba(255,240,180,.45)');
  ell(x,y,r,r,'#FFF1B8');ell(x-r*.35,y-r*.4,r*.16,r*.12,'#F3DC8C');ell(x+r*.45,y+r*.45,r*.12,r*.1,'#F3DC8C');ell(x+r*.5,y-r*.2,r*.08,r*.08,'#F3DC8C');
  sleepyEye(x-r*.33,y-r*.05,r*.13,open);if(wink>.5){g.strokeStyle='#3A2A2A';g.lineWidth=r*.05;g.beginPath();g.moveTo(x+r*.2,y-r*.05);g.lineTo(x+r*.46,y-r*.05);g.stroke()}else sleepyEye(x+r*.33,y-r*.05,r*.13,open);
  ell(x-r*.55,y+r*.2,r*.14,r*.09,'rgba(255,140,150,.55)');ell(x+r*.55,y+r*.2,r*.14,r*.09,'rgba(255,140,150,.55)');

    if(t>69.5){const q=easeOut(prog(t,69.5,70.5));g.save();g.globalAlpha=q;bigCloud(540,1210,.6,'rgba(255,255,255,.9)');bunny(540,1150,.5,t);g.restore()}
  }
  else if(t<90){ // dreamland: bunny on cloud, tiny stars
    sky('#6D5BD0','#F0ABFC');
    for(let k=0;k<40;k++){const tw=.4+.6*Math.abs(Math.sin(t*2+k));g.globalAlpha=tw;starShape(rnd(k)*W,rnd(k+9)*1000,10+rnd(k+2)*14,t*.3+k,'#FFF7C2')}g.globalAlpha=1;
    moonFace(860,330,80,t);
    bigCloud(200,1350,.6,'rgba(255,255,255,.6)');bigCloud(880,1250,.55,'rgba(255,255,255,.6)');
    bigCloud(540,1150,1.1);bunny(540,1000,.9,t);
    if(t>79)for(let k=0;k<6;k++){const a=k/6*Math.PI*2+t*.4;starFace(540+Math.cos(a)*330,650+Math.sin(a)*120,32,t,k)}
    if(t>84){g.save();g.globalAlpha=prog(t,84,85);for(let k=0;k<4;k++){ell(150+k*260,820+Math.sin(t+k)*20,40,26,['#F9A8D4','#A5B4FC','#FDE68A','#99F6E4'][k]);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(150+k*260,846);g.lineTo(150+k*260,960);g.stroke()}g.restore()}
  }
  else if(t<108){ // twinkle / superstar / so ja / fun hazaar
    nightSky(t,'#13104A','#5B2F8A');moonFace(860,300,80,t,t>93&&t<93.6);
    if(t<99){for(let k=0;k<5;k++){const x=180+k*180,y=800+Math.sin(t*2+k)*40;starFace(x,y,62,t,k,t>93&&t<96)}
      if(t>96)notes(540,1250,t,96,6)}
    else if(t<105){const q=backOut(prog(t,99,100));elephant(0,540,1320,{s:1.3,t,trunk:.6,happy:1});
      g.save();g.translate(610,990);g.scale(q,q);starShape(0,0,90,rock(t)*.15,'#FFD84D');starShape(0,0,70,rock(t)*.15,'#FFE680');g.restore();
      if(t>102){g.save();g.globalAlpha=prog(t,102,103)*.6;g.fillStyle='#0B0A2A';g.fillRect(0,0,W,H);g.restore();zzz(700,900,t,1.2)}}
    else{sky('#7DD3FC','#FDE68A');g.fillStyle='#86EFAC';g.fillRect(0,1300,W,H-1300);
      for(let k=0;k<7;k++){const bx=120+k*140,by=900-((t-105)*120+k*90)%600;ell(bx,by,45,56,['#EF4444','#F59E0B','#22C55E','#3B82F6','#A855F7','#EC4899','#14B8A6'][k]);g.strokeStyle='#555';g.lineWidth=2;g.beginPath();g.moveTo(bx,by+56);g.lineTo(bx+Math.sin(t*3+k)*10,by+200);g.stroke()}
      elephant(0,540,1320-pulse(t)*50,{s:1.15,t,trunk:.9,happy:1});
      g.save();g.globalAlpha=.25;g.fillStyle='#fff';g.fillRect(0,0,W,H);g.restore();ell(540,700,420,260,'rgba(255,255,255,0)')}
  }
  else if(t<123){ // mumma papa beside the bed
    bedScene(t,0,{behind:()=>parents(t,easeOut(prog(t,108,109.5)))});zzz(430,1000,t);
    if(t>114)for(let k=0;k<6;k++){const p=((t*.4+k/6)%1);g.save();g.globalAlpha=(1-p);txt('♥',300+k*90+Math.sin(p*5)*20,1300-p*400,44,'#FB7185',null);g.restore()}
  }
  else { // 123-129 good night, sweet dreams: dream bubble
    nightSky(t,'#0B1446','#3E2A78');moonFace(540,520,150,t);
    const q=easeOut(prog(t,123,124.5));g.save();g.globalAlpha=q;bigCloud(540,1150,1.2,'rgba(255,255,255,.92)');
    bunny(380,1080,.55,t);starFace(560,1010,50,t,2,1);owl(720,1080,.5,t);g.restore();
  }
  // gentle cross-fades between scenes
  [22.5,33.2,39.4,42.4,51,57,75,90,99,105,108,123,129].forEach(c=>{const d=Math.abs(t-c);if(d<.35){g.fillStyle=`rgba(8,6,30,${(1-d/.35)*.9})`;g.fillRect(0,0,W,H)}});
  if(t<END-11){ntitle(t);caption(t,CAPS);g.save();g.globalAlpha=.9;popcornLogo(92,172,.24,0);g.restore()}
  // end card
  if(t>=END-11){const q=easeOut(prog(t,END-11,END-9.6));g.save();g.globalAlpha=q*.75;g.fillStyle='#07061F';g.fillRect(0,0,W,H);g.restore();
    g.save();g.globalAlpha=q;popcornLogo(W/2,640,.95*backOut(prog(t,END-11,END-9.8)),Math.max(0,Math.sin(Math.PI*prog(t,END-9.8,END-9.3)))*.25);
    txt('A Popcorn Productions video',W/2,1040,46,'#FFE600',null,'center',600);
    txt('शुभ रात्रि! Good night 🌙',W/2,1140,58,'#FFF7D6',null);
    const sp=backOut(prog(t,END-9,END-8));g.translate(W/2,1290);g.scale(sp,sp);rr(-250,-58,500,116,58,'#E11D48');txt('▶  SUBSCRIBE',0,0,54,'#fff',null);g.restore();
    caption(t,CAPS)}
  if(t<.8){g.fillStyle=`rgba(0,0,0,${1-t/.8})`;g.fillRect(0,0,W,H)}
  const f=prog(t,END-1.8,END);if(f>0){g.fillStyle=`rgba(0,0,0,${f})`;g.fillRect(0,0,W,H)}
}
